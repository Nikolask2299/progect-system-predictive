spring:
  config:
    activate:
      on-profile: dev

server:
  port: 9101

logging:
  level:
    com.project.pdm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
    kafka:
      topic-aggregation: "telemetry-aggregation.raw"
      topic: "telemetry.raw"
      group-id: "ingest-service-pdm"