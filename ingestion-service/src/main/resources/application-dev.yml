spring:
  config:
    activate:
      on-profile: dev

server:
  port: 9101

logging:
  level:
    com.project.pdm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
    kafka:
      topic-aggregation: "telemetry-aggregation.raw"
      topic: "telemetry.raw"
      group-id: "ingest-service-pdm"

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME}}
    prefer-ip-address: false