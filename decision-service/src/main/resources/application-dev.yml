spring:
  config:
    activate:
      on-profile: dev

server:
  port: 9103

logging:
  level:
    com.project.pdm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOST:${HOSTNAME}}
    prefer-ip-address: false

pdm:
  alert:
    threshold-critical: 10.0
    expiration-threshold-hours: 24
    expiration-scan-interval-ms: 3600000