spring:
  config:
    activate:
      on-profile: dev

server:
  port: 9102

logging:
  level:
    com.project.pdm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  circuit:
    failure-threshold: 5
    reset-timeout: 60
  cache:
    cache-name: predictionsCache
    maximumSize: 100
    expireAfterAccess: 1000
  pdm.ml:
    timeout-ms: 1500
    max-attempts: 3
  kafka:
    topic-aggregation: "telemetry-aggregation.raw"
    group-id: "prediction-service-pdm"

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME}}
    prefer-ip-address: false