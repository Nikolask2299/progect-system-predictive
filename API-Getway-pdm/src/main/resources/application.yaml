spring:
  application:
    name: API-Getaway-pdm

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
    discovery:
      enabled: true
      client:
        health-indicator:
          enabled: true
          use-services-query: true
        composite-indicator:
          enabled: true

server:
  port: 8080

eureka:
    client:
      service-url:
        defaultZone: http://eureka-server:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
    instance:
      hostname: ${EUREKA_INSTANCE_HOST:${HOSTNAME}}
      prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    gateway:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}